# centralized-docs Rust Toolchain Configuration
# Uses stable Rust for production reliability
# Pinning to 1.85 for edition 2024 support

[toolchain]
channel = "1.94"
components = ["rustfmt", "clippy", "rust-analyzer"]

# Target support - add platforms as needed
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
