# Moon task definitions for centralized-docs - FULL CAPACITY UTILIZATION

# Task: Format code
fmt:
  command: go fmt ./...
  description: Format all Go code
  inputs:
    - "**/*.go"
  outputs:
    - "**/*.go"
  cache: false  # Formatting always runs but outputs cached

# Task: Generate mocks (setup for testing)
generate:
  command: go generate ./...
  description: Generate code (mocks, etc.)
  inputs:
    - internal/ports/*.go
    - go.mod
  outputs:
    - internal/mocks/**/*
  deps:
    - install-tools
  cache: true

# Task: Install development tools
install-tools:
  command: |
    go install github.com/vektra/mockery/v2@latest
  description: Install development dependencies
  local: true  # Don't cache, always check tools
  outputs:
    - ~/go/bin/mockery

# Task: Run linter
lint:
  command: golangci-lint run --out-format colored-line-number
  description: Run static analysis and linting
  inputs:
    - "**/*.go"
    - go.mod
    - go.sum
    - .golangci.yml
  outputs:
    - lint-report.json
  cache: true
  cacheable: true
  deps:
    - fmt  # Code must be formatted before linting

# Task: Run tests with coverage (no parallel - Go test handles this)
test:
  command: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
  description: Run all tests with race detector and coverage
  inputs:
    - "**/*.go"
    - go.mod
    - go.sum
    - "**/*_test.go"
  outputs:
    - coverage.out
  cache: true
  deps:
    - generate  # Mocks must be generated first

# Task: Generate coverage report (HTML)
coverage-report:
  command: go tool cover -html=coverage.out -o coverage.html
  description: Generate HTML coverage report
  inputs:
    - coverage.out
  outputs:
    - coverage.html
  cache: true
  deps:
    - test

# Task: Extract coverage percentage
coverage-percent:
  command: |
    go tool cover -func=coverage.out | grep total | awk '{print $(NF-1)}'
  description: Display coverage percentage
  inputs:
    - coverage.out
  cache: true
  deps:
    - test

# Task: Verify coverage threshold
coverage-check:
  command: |
    COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $(NF-1)}' | sed 's/%//')
    THRESHOLD=90
    if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
      echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
      exit 1
    fi
    echo "✅ Coverage $COVERAGE% meets threshold ($THRESHOLD%)"
  description: Verify coverage meets 90% minimum
  inputs:
    - coverage.out
  cache: true
  deps:
    - test

# Task: Build CLI binary
build:
  command: go build -o bin/docmgr cmd/docmgr/main.go
  description: Build the CLI binary
  inputs:
    - "**/*.go"
    - go.mod
    - go.sum
  outputs:
    - bin/docmgr
  cache: true
  deps:
    - lint      # Lint before build
    - test      # Tests must pass before build

# Task: Build for multiple platforms
build-all:
  command: |
    GOOS=linux GOARCH=amd64 go build -o bin/docmgr-linux-amd64 cmd/docmgr/main.go
    GOOS=darwin GOARCH=amd64 go build -o bin/docmgr-darwin-amd64 cmd/docmgr/main.go
    GOOS=darwin GOARCH=arm64 go build -o bin/docmgr-darwin-arm64 cmd/docmgr/main.go
    GOOS=windows GOARCH=amd64 go build -o bin/docmgr-windows-amd64.exe cmd/docmgr/main.go
  description: Build CLI for all platforms
  inputs:
    - "**/*.go"
    - go.mod
    - go.sum
  outputs:
    - bin/docmgr-*
  cache: true
  deps:
    - coverage-check

# Task: Install locally
install:
  command: go install ./cmd/docmgr
  description: Install CLI locally
  cache: false  # Always install latest
  deps:
    - build

# Task: Run integration tests
test-integration:
  command: go test -v -race -tags=integration -coverprofile=coverage-integration.out ./...
  description: Run integration tests (slower, real I/O)
  inputs:
    - "**/*.go"
    - go.mod
    - go.sum
  outputs:
    - coverage-integration.out
  cache: true
  deps:
    - generate

# Task: Full quality gate pipeline (sequential, enforces order)
quality:
  command: echo "Running full quality checks..."
  description: Run all quality gates (fmt → lint → test → coverage-check)
  cache: false  # Orchestration task
  deps:
    - fmt
    - lint
    - test
    - coverage-check
  local: true

# Task: CI/CD full pipeline (everything)
ci:
  command: echo "Running full CI pipeline..."
  description: Run complete CI (quality → build)
  cache: false  # Orchestration task
  deps:
    - quality
    - build
  local: true

# Task: Development loop (fast, with watch)
dev:
  command: |
    echo "Running in development mode..."
    echo "Use: moon run dev --watch"
  description: Development mode (with file watching)
  cache: false
  deps:
    - fmt
    - lint
    - test
  watch: true

# Task: Clean build artifacts and cache
clean:
  command: |
    rm -rf bin/ dist/ coverage.* *.prof .moon/cache
    go clean -cache -testcache
  description: Clean all generated files and caches
  cache: false
  local: true

# Task: Check dependencies for updates
deps-check:
  command: go list -u -m all | grep "\[" || echo "All dependencies up to date"
  description: Check for outdated dependencies
  cache: false
  local: true

# Task: Update dependencies
deps-update:
  command: go get -u ./...
  description: Update all dependencies
  cache: false
  local: true
  inputs:
    - go.mod
  outputs:
    - go.mod
    - go.sum
