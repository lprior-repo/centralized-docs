# Moon task definitions for centralized-docs - RUST EDITION

# Task: Format code with rustfmt
fmt:
  command: cargo fmt --all
  description: Format all Rust code
  inputs:
    - "**/*.rs"
  outputs:
    - "**/*.rs"
  cache: false

# Task: Run clippy linter
lint:
  command: cargo clippy --all-targets --all-features -- -D warnings
  description: Run Clippy static analysis and linting
  inputs:
    - "**/*.rs"
    - Cargo.toml
    - Cargo.lock
  outputs:
    - target/clippy-output.json
  cache: true
  cacheable: true
  deps:
    - fmt

# Task: Run tests with coverage
test:
  command: cargo test --all-features --verbose
  description: Run all tests
  inputs:
    - "**/*.rs"
    - Cargo.toml
    - "**/*_test.rs"
  outputs:
    - target/debug/deps/
  cache: true
  deps:
    - fmt

# Task: Run tests in short mode (TCR)
test-short:
  command: cargo test --lib --all-features
  description: Run unit tests (TCR short mode)
  inputs:
    - "**/*.rs"
    - Cargo.toml
  cache: true
  deps:
    - fmt

# Task: Build binary
build:
  command: cargo build --release
  description: Build the release binary
  inputs:
    - "**/*.rs"
    - Cargo.toml
  outputs:
    - target/release/doc_transformer
  cache: true
  deps:
    - lint
    - test

# Task: Build debug binary
build-debug:
  command: cargo build
  description: Build the debug binary
  inputs:
    - "**/*.rs"
    - Cargo.toml
  cache: true
  deps:
    - fmt

# Task: Run the binary
run:
  command: cargo run --release
  description: Run the release binary
  cache: false
  deps:
    - build

# Task: Full quality gate pipeline
quality:
  command: echo "Running Rust quality checks..."
  description: Run all quality gates (fmt → lint → test)
  cache: false
  deps:
    - fmt
    - lint
    - test
  local: true

# Task: CI/CD full pipeline
ci:
  command: echo "Running full CI pipeline..."
  description: Run complete CI (quality → build)
  cache: false
  deps:
    - quality
    - build
  local: true

# Task: Development loop
dev:
  command: echo "Running in development mode..."
  description: Development mode (with cargo watch)
  cache: false
  deps:
    - fmt
    - lint
    - test
  watch: true

# Task: Clean build artifacts and cache
clean:
  command: |
    cargo clean
    rm -rf target/ bin/ dist/ .moon/cache
  description: Clean all generated files and caches
  cache: false
  local: true

# Task: Check dependencies for updates
deps-check:
  command: cargo outdated
  description: Check for outdated dependencies
  cache: false
  local: true

# Task: Update dependencies
deps-update:
  command: cargo update
  description: Update all dependencies
  cache: false
  local: true
  inputs:
    - Cargo.toml
  outputs:
    - Cargo.lock

# Task: Generate documentation
doc:
  command: cargo doc --no-deps --open
  description: Generate and open documentation
  outputs:
    - target/doc/
  cache: true

# Task: Check code
check:
  command: cargo check --all-features
  description: Quick syntax and type check
  inputs:
    - "**/*.rs"
    - Cargo.toml
  cache: true
