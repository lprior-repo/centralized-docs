$schema: "https://moonrepo.dev/schemas/tasks.json"

# Moon Task Configuration - centralized-docs Pipeline
# All commands use cargo with system Rust toolchain

tasks:
  # ============================================================================
  # STAGE 1: CODE FORMATTING & LINTING
  # ============================================================================

  fmt:
    command: "cargo fmt --all --check"
    description: "Check code formatting (rustfmt)"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
      - "rustfmt.toml"
    options:
      cache: true
      runInCI: true

  fmt-fix:
    command: "cargo fmt --all"
    description: "Auto-fix code formatting"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
    options:
      cache: false  # Never cache - always format

  clippy:
    command: "cargo clippy --workspace --all-targets --all-features -- -D warnings"
    description: "Lint with Clippy (strict mode)"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
      - ".clippy.toml"
    options:
      cache: true
      runInCI: true

  # ============================================================================
  # STAGE 2: TESTING
  # ============================================================================

  test:
    command: "cargo test --workspace --all-features"
    description: "Run all tests"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      cache: true
      runInCI: true

  test-doc:
    command: "cargo test --doc --workspace"
    description: "Run documentation tests"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      cache: true
      runInCI: true

  # ============================================================================
  # STAGE 3: BUILD
  # ============================================================================

  build:
    command: "cargo build --release --workspace"
    description: "Build release binaries"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      cache: true
      runInCI: true

  build-docs:
    command: "cargo doc --no-deps --document-private-items"
    description: "Generate Rust documentation"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      cache: true
      runInCI: true

  # ============================================================================
  # COMPOSITE PIPELINES
  # ============================================================================

  quick:
    command: "true"
    description: "Fast lint check (format + clippy in parallel)"
    deps:
      - "~:fmt"      # ~ prefix runs in parallel
      - "~:clippy"
    options:
      cache: false  # Composite task - deps handle caching

  ci:
    command: "true"
    description: "Full CI pipeline (all checks in parallel where possible)"
    deps:
      - "~:fmt"        # Parallel: formatting
      - "~:clippy"     # Parallel: linting
      - "~:test"       # Parallel: tests
      - "~:test-doc"   # Parallel: doc tests
      - "build"        # Sequential: needs tests to pass
      - "build-docs"   # Sequential: needs clippy
    options:
      cache: false  # Composite task - deps handle caching

  # ============================================================================
  # CONVENIENCE
  # ============================================================================

  install:
    command: "mkdir -p ~/.local/bin && cargo build --release --workspace && cp target/release/doc_transformer ~/.local/bin/doc_transformer && cp target/release/mcp_server ~/.local/bin/mcp_server && cp target/release/llms-txt-validator ~/.local/bin/llms-txt-validator && chmod +x ~/.local/bin/doc_transformer ~/.local/bin/mcp_server ~/.local/bin/llms-txt-validator && echo '✅ Installed binaries to ~/.local/bin'"
    description: "Install binaries to ~/.local/bin (system-wide)"
    options:
      cache: false
      runInCI: false

  dev:
    command: "true"
    description: "Quick development workflow: build + install"
    deps:
      - "build"
      - "install"
    options:
      cache: false

  clean:
    command: "cargo clean"
    description: "Clean build artifacts"
    options:
      cache: false

  check:
    command: "cargo check --workspace --all-features"
    description: "Fast type check without building"
    inputs:
      - "**/*.rs"
      - "Cargo.toml"
      - "/Cargo.lock"
    options:
      cache: true
      runInCI: false

  # ============================================================================
  # QUALITY GATES
  # ============================================================================

  quality:
    command: "true"
    description: "Run all quality gates (fmt + clippy + test)"
    deps:
      - "fmt"
      - "clippy"
      - "test"
    options:
      cache: false
