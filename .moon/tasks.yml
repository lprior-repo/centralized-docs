$schema: "https://moonrepo.dev/schemas/tasks.json"

# Simplified Moon Task Configuration

tasks:
  fmt:
    command: "cargo fmt --all --check"
    description: "Check code formatting"
    inputs: ["**/*.rs", "Cargo.toml", "rustfmt.toml"]
    options:
      cache: true
      runInCI: true

  fmt-fix:
    command: "cargo fmt --all"
    description: "Auto-fix code formatting"
    inputs: ["**/*.rs", "Cargo.toml"]
    options:
      cache: false

  clippy:
    command: "cargo clippy --workspace --all-targets --all-features"
    description: "Lint with Clippy"
    inputs: ["**/*.rs", "Cargo.toml", "/Cargo.lock", ".clippy.toml"]
    options:
      cache: true
      runInCI: true

  test:
    command: "cargo test --workspace --all-features"
    description: "Run all tests"
    inputs: ["**/*.rs", "Cargo.toml", "/Cargo.lock"]
    options:
      cache: true
      runInCI: true
    env:
      CARGO_BUILD_JOBS: "16"

  test-doc:
    command: "cargo test --doc --workspace"
    description: "Run documentation tests"
    inputs: ["**/*.rs", "Cargo.toml", "/Cargo.lock"]
    options:
      cache: true
      runInCI: true

  build:
    command: "cargo build --release --workspace"
    description: "Build release binaries"
    inputs: ["**/*.rs", "Cargo.toml", "/Cargo.lock"]
    options:
      cache: true
      runInCI: true
    env:
      CARGO_BUILD_JOBS: "24"

  install:
    command: "sh -c 'cargo build --release --workspace && for bin in doc_transformer llms_txt_validator release-gate; do [ -f target/release/$bin ] && cp target/release/$bin ~/.local/bin/$bin; done && chmod +x ~/.local/bin/doc_transformer ~/.local/bin/llms_txt_validator ~/.local/bin/release-gate 2>/dev/null || true'"
    description: "Install binaries to ~/.local/bin"
    options:
      cache: false

  clean:
    command: "cargo clean"
    description: "Clean build artifacts"
    options:
      cache: false

  check:
    command: "cargo check --workspace --all-features"
    description: "Fast type check"
    inputs: ["**/*.rs", "Cargo.toml", "/Cargo.lock"]
    options:
      cache: true

  quick:
    command: "true"
    description: "Format + clippy check (parallel)"
    deps: ["~:fmt", "~:clippy"]
    options:
      cache: false

  ci:
    command: "true"
    description: "Full CI pipeline"
    deps: ["~:fmt", "~:clippy", "~:test", "~:test-doc", "build"]
    options:
      cache: false

  quality:
    command: "true"
    description: "Run all quality gates (fmt + clippy + test)"
    deps: ["fmt", "clippy", "test"]
    options:
      cache: false

  release-gate:
    command: "sh -c 'cd . && cargo run --release -p release-gate'"
    description: "Run release go-no-go gate"
    inputs: [".beads/issues.jsonl", "release-gate/**"]
    options:
      cache: false
