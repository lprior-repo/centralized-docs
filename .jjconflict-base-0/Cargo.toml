[workspace]
members = ["centralized-docs", "contextual-chunker", "llms-txt-parser", "benchmark_server"]
exclude = ["centralized-docs/fuzz"]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.94"
authors = ["centralized-docs Contributors"]
license = "MIT"
repository = "https://github.com/lprior-repo/centralized-docs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
dead_code = "deny"
unused_must_use = "deny"

[workspace.dependencies]
# FP primitives (The Holy Trinity)
im = "15.1"
tap = "1"
itertools = "0.14"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"

[workspace.lints.clippy]
# Zero unwrap law - COMPILE ERRORS (relaxed in tests)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Enforce immutability and purity (Haskell-like FP)
mut_mut = "deny"                      # No deeply mutable references
mutex_atomic = "deny"                 # Use atomics over mutexes when possible
print_stdout = "deny"                 # No direct stdout (use tracing)
print_stderr = "deny"                 # No direct stderr (use tracing)
use_debug = "deny"                    # No println!/dbg! for debugging
exit = "deny"                         # No process::exit
indexing_slicing = "deny"             # No panicking [] indexing - use .get()

# Enforce functional iteration patterns
needless_range_loop = "deny"          # Use .iter() instead of for i in 0..len
explicit_counter_loop = "deny"        # Use .enumerate() instead
manual_find = "deny"                  # Use .find() instead of manual loop
filter_map_next = "deny"              # Use .find_map() instead

# Enforce Result/Option handling
option_if_let_else = "deny"           # Use .map_or() instead
manual_ok_or = "deny"                 # Use .ok_or() instead

# Quality enforcement (with priority)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Specific allows
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
type_complexity = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
map_unwrap_or = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# ===========================================================================
# PROFILING PROFILES
# ===========================================================================
# These profiles are optimized for profiling, not production.
# They enable debug info and frame pointers so profilers can resolve symbols.

# Profile for flamegraph / samply / perf profiling
# Usage: cargo build --profile profiling
[profile.profiling]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"     # Source-line debug info for profilers
strip = false                  # Keep symbols for profiling

# Benchmark profile (used by cargo bench / criterion)
# criterion uses the "bench" profile in release mode
[profile.bench]
inherits = "release"
opt-level = 3
debug = "line-tables-only"     # Source-line debug info for profilers
