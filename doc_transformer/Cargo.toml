[package]
name = "doc_transformer"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
petgraph = { version = "0.6", features = ["serde-1"] }
once_cell = "1.19"
urlencoding = "2.1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.8"
