[package]
name = "doc_transformer"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "doc_transformer"
path = "src/main.rs"

[[bin]]
name = "llms_txt_validator"
path = "src/bin/llms_txt_validator.rs"

[lib]
name = "doc_transformer"
path = "src/lib.rs"

[dependencies]
# Core utilities
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
walkdir = "2.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["macros"] }

# Graph library (UPDATED: 0.6 → 0.8.2)
petgraph = { version = "0.8", features = ["serde-1"] }

# Functional Programming Libraries
tap = "1.0"
strum = { version = "0.26", features = ["derive"] }
itertools = "0.13"

# Web scraping (spider-rs ecosystem) - Updated to latest
# Note: sync feature enables tokio synchronization primitives
spider = { version = "2.39", default-features = false, features = ["sitemap", "sync"] }
spider_transformations = "2.37"

# URL handling
url = { version = "2.5", features = ["serde"] }

# HTML parsing (UPDATED: 0.20 → 0.25)
scraper = "0.25"

# Full-text search with BM25
tantivy = "0.25"

# Markdown parsing (CommonMark/GFM with AST)
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Content extraction (Mozilla Readability algorithm)
readability = "0.3"
hnsw_rs = "0.3"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "graph_bench"
harness = false
