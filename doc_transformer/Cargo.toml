[package]
name = "doc_transformer"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "doc_transformer"
path = "src/main.rs"

[lib]
name = "doc_transformer"
path = "src/lib.rs"

[dependencies]
# Core utilities
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }

# Graph library (UPDATED: 0.6 → 0.8.2)
petgraph = { version = "0.8", features = ["serde-1"] }

# Functional Programming Libraries
im = "15.1"
tap = "1.0"
strum = { version = "0.26", features = ["derive"] }
itertools = "0.13"

# Web scraping (spider-rs ecosystem) - CURRENT & BEST-IN-CLASS
spider = { version = "2", default-features = false, features = ["sitemap"] }
spider_transformations = "2"

# URL handling
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"

# HTML parsing (UPDATED: 0.20 → 0.25)
scraper = "0.25"

# YAML parsing (REPLACED: serde_yaml deprecated → serde-saphyr)
serde-saphyr = "0.0.10"

# NEW: Full-text search with BM25
tantivy = "0.25"

# NEW: Markdown parsing (CommonMark/GFM with AST)
pulldown-cmark = { version = "0.13", default-features = false }

# NEW: Content extraction (Mozilla Readability algorithm)
readability = "0.3"

# NEW: MCP SDK for building MCP server
rust-mcp-sdk = "0.8"

[dev-dependencies]
tempfile = "3.8"
