name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: doc_transformer-${{ github.ref_name }}-linux-x86_64.tar.gz
            binary_name: doc_transformer
            validator_name: llms_txt_validator
            is_windows: false
          - os: macos-latest
            artifact_name: doc_transformer-${{ github.ref_name }}-macos-aarch64.tar.gz
            binary_name: doc_transformer
            validator_name: llms_txt_validator
            is_windows: false
          - os: windows-latest
            artifact_name: doc_transformer-${{ github.ref_name }}-windows-x86_64.zip
            binary_name: doc_transformer.exe
            validator_name: llms_txt_validator.exe
            is_windows: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node (for moon)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Moon
        run: npm install -g @moonrepo/cli

      - name: Build Release Binaries
        run: moon run :build

      - name: Prepare Artifact (Linux/Mac)
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary_name }} dist/
          cp target/release/${{ matrix.validator_name }} dist/ 2>/dev/null || true
          cd dist
          tar -czvf ../${{ matrix.artifact_name }} *

      - name: Prepare Artifact (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/${{ matrix.binary_name }} -Destination dist/
          if (Test-Path target/release/${{ matrix.validator_name }}) {
            Copy-Item target/release/${{ matrix.validator_name }} -Destination dist/
          }
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
