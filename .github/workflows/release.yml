name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }} (${{ matrix.target_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_arch: x86_64-unknown-linux-gnu
            artifact_name: doc_transformer-${{ github.ref_name }}-linux-x86_64.tar.gz
            binary_name: doc_transformer
            validator_name: llms_txt_validator
            is_windows: false

          - os: macos-latest
            target_arch: aarch64-apple-darwin
            artifact_name: doc_transformer-${{ github.ref_name }}-macos-aarch64.tar.gz
            binary_name: doc_transformer
            validator_name: llms_txt_validator
            is_windows: false

          # Add Mac Intel support explicitly via cross-compilation on the latest macos runner
          - os: macos-latest
            target_arch: x86_64-apple-darwin
            artifact_name: doc_transformer-${{ github.ref_name }}-macos-x86_64.tar.gz
            binary_name: doc_transformer
            validator_name: llms_txt_validator
            is_windows: false

          - os: windows-latest
            target_arch: x86_64-pc-windows-msvc
            artifact_name: doc_transformer-${{ github.ref_name }}-windows-x86_64.zip
            binary_name: doc_transformer.exe
            validator_name: llms_txt_validator.exe
            is_windows: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target_arch }}

      - name: Setup Node (for moon)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Moon
        run: npm install -g @moonrepo/cli

      # We pass the CARGO_BUILD_TARGET to ensure cargo respects the target architecture
      - name: Build Release Binaries
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target_arch }}
        run: moon run :build

      - name: Prepare Artifact (Linux/Mac)
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          mkdir -p dist
          # Copy binaries from the target-specific release folder
          cp target/${{ matrix.target_arch }}/release/${{ matrix.binary_name }} dist/
          cp target/${{ matrix.target_arch }}/release/${{ matrix.validator_name }} dist/ 2>/dev/null || true
          
          # Include documentation and licensing
          cp README.md dist/ 2>/dev/null || true
          cp LICENSE dist/ 2>/dev/null || true
          
          cd dist
          tar -czvf ../${{ matrix.artifact_name }} *

      - name: Prepare Artifact (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target_arch }}/release/${{ matrix.binary_name }} -Destination dist/
          if (Test-Path target/${{ matrix.target_arch }}/release/${{ matrix.validator_name }}) {
            Copy-Item target/${{ matrix.target_arch }}/release/${{ matrix.validator_name }} -Destination dist/
          }
          if (Test-Path README.md) { Copy-Item README.md -Destination dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination dist/ }
          
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*
          generate_release_notes: true
