language: rust

tasks:
  build:
    command: cargo
    args: ["build", "--release", "-p", "centralized-docs"]
    description: Build release binary

  test:
    command: cargo
    args: ["test", "-p", "centralized-docs", "--no-fail-fast"]
    description: Run all tests

  check:
    command: cargo
    args: ["check", "-p", "centralized-docs"]
    description: Type check

  clippy:
    command: cargo
    args: ["clippy", "-p", "centralized-docs", "--no-deps", "--", "-D", "warnings"]
    description: Lint

  fmt:
    command: cargo
    args: ["fmt", "--check"]
    description: Check formatting
