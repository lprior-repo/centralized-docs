[package]
name = "centralized-docs"
version = "0.6.1"
edition = "2021"

[[bin]]
name = "ctd"
path = "src/main.rs"

[[bin]]
name = "ctd-mcp"
path = "src/bin/ctd_mcp.rs"

[[bin]]
name = "llms_txt_validator"
path = "src/bin/llms_txt_validator.rs"

[lib]
name = "doc_transformer"
path = "src/lib.rs"

[dependencies]
# Workspace crates
contextual-chunker = { path = "../contextual-chunker" }

# Core utilities
regex = "1.10"
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = "1.0"
serde_yaml = "0.9"
walkdir = "2.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["io-std", "macros", "process"] }

# Graph library (UPDATED: 0.6 -> 0.8.2)
petgraph = { version = "0.8", features = ["serde-1"] }

# Functional Programming Libraries
tap = "1.0"
strum = { version = "0.26", features = ["derive"] }
itertools = "0.13"
derive_more = { version = "1.0", features = ["display", "deref", "as_ref"] }
rpds = "1.2"                    # Persistent immutable data structures (HashTrieMap, HashTrieSet, Vector)
im = "15.1"                     # Thread-safe persistent collections (Arc-based, for concurrent contexts)

unicode-segmentation = "1.12"

# Web scraping (spider-rs ecosystem)
# Note: sync feature enables tokio synchronization primitives
# Using 2.39 to avoid cache_mem compilation issues in 2.40+
spider = { version = "=2.39", default-features = false, features = ["sitemap", "sync", "reqwest_native_tls_vendored"] }
spider_transformations = "2.37"

# URL handling
url = { version = "2.5", features = ["serde"] }

# Git operations
git2 = "0.19"

# HTML parsing (UPDATED: 0.20 -> 0.25)
scraper = "0.25"

# Full-text search with BM25
tantivy = "0.25"

# Markdown parsing (CommonMark/GFM with AST)
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Content extraction (Mozilla Readability algorithm)
readability = "0.3"
hnsw_rs = "0.3"
thiserror = "1.0"
tracing = { version = "0.1", features = ["attributes"] }

# Embedding providers (OpenAI, Cohere)
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tungstenite = { version = "*", features = ["rustls-tls-webpki-roots"], default-features = false }
pulldown-cmark-to-cmark = "22.0.0"

# File locking for concurrent access control
fs2 = "0.4"
ordered-float = "5.1.0"
rayon = "1.11.0"

# High-performance ACID key-value cache (idempotency)
redb = "2"

# Cryptographic hashing (stable, content-addressed keys)
sha2 = "0.10"
lru = "0.16.3"
parking_lot = "0.12.5"

# Zero-copy serialization (rkyv 0.8 for persisted output records)
rkyv = { version = "0.8", features = ["std", "bytecheck"] }

# Zero-copy transmute (safe Pod casts for redb mmap'd values)
bytemuck = { version = "1", features = ["derive", "const_zeroed"] }

[dependencies.rmcp]
version = "1.3"

[dependencies.rmcp-macros]
version = "1.3"

[dependencies.schemars]
version = "1.2"

[dev-dependencies]
tempfile = "3.8"
rstest = "0.24"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tiny_http = "0.12"
portpicker = "0.1"
playwright-rs = "0.8"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
rmcp = { version = "1.3", features = ["client"] }
rkyv = { version = "0.8", features = ["std", "bytecheck"] }
bytemuck = { version = "1", features = ["derive", "const_zeroed"] }
redb = "2"
console-subscriber = "0.4"

[[test]]
name = "llms_test_multibyte"
path = "src/llms_test_multibyte.rs"

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "watch_benchmarks"
harness = false

[[bench]]
name = "filter_benchmarks"
harness = false

[[bench]]
name = "state_snapshot_benchmarks"
harness = false

[[bench]]
name = "state_db_benchmarks"
harness = false

[[bench]]
name = "async_perf_benchmarks"
harness = false

# ===========================================================================
# FEATURE TIERS - Spider-rs Feature Parity
# ===========================================================================
#
# Tier 1: Core (default) - always enabled
#   - sitemap: Sitemap-based URL discovery
#   - sync: Tokio synchronization primitives
#
# Tier 2: Enhanced - non-breaking additions
#   - cache: Response caching
#   - cache_mem: In-memory caching
#   - regex: Regex-based URL filtering
#   - glob: Glob-based URL filtering
#   - time: Time-based utilities
#   - serde: Serialization support
#
# Tier 3: JavaScript - optional, significant overhead
#   - chrome: Chrome browser integration
#   - chrome_headless_new: New headless Chrome mode
#   - smart: Smart rendering detection
#
# Tier 4: Anti-detection
#   - ua_generator: User agent generation
#   - spoof: Browser spoofing
#   - headers: Custom headers
#   - cookies: Cookie handling
#
# Tier 5: Full - all features
#   - control: Advanced control features
# ===========================================================================

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
console = []
localembed = []

# Tier 1: Core - always enabled (default)
default = ["sitemap", "sync"]
sitemap = ["spider/sitemap"]
sync = ["spider/sync"]

# Tier 2: Enhanced - non-breaking additions
# Note: spider-rs 2.39 has compilation bugs with many features
# We provide the feature structure for future compatibility
# but only enable features that work currently
enhanced = [
    "default",
]
# Individual enhanced features (reserved for future use when spider-rs fixes issues)
# url_regex = ["spider/regex"]  # Causes compilation error in spider-rs 2.39
# url_glob = ["spider/glob"]    # May have issues

# Tier 3: JavaScript - optional, significant overhead
# Note: chrome feature requires real_browser subfeature to compile
javascript = [
    "enhanced",
]
# Individual JavaScript features
# chrome = ["spider/chrome"]  # Requires real_browser feature which has issues
# chrome_headless_new = ["spider/chrome_headless_new"]  # Same issue
# smart = ["spider/smart"]

# Tier 4: Anti-detection
anti-detection = [
    "enhanced",
    "spider/ua_generator",
    "spider/spoof",
    "spider/headers",
    "spider/cookies",
]
# Individual anti-detection features
ua_generator = ["spider/ua_generator"]
spoof = ["spider/spoof"]
headers = ["spider/headers"]
cookies = ["spider/cookies"]

# Tier 5: Full - all features enabled
full = [
    "enhanced",
    "javascript",
    "anti-detection",
    "spider/control",
]
