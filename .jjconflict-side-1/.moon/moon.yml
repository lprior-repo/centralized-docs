# Moon workspace configuration
workspace:
  vcs:
    manager: git
  root: .

projects:
  ctd:
    root: centralized-docs
    language: rust

# Workspace-level tasks that run on the whole workspace
tasks:
  build:
    command: cargo
    args: ["build", "--release", "-p", "centralized-docs"]
    description: Build ctd release

  test:
    command: cargo
    args: ["test", "-p", "centralized-docs"]
    description: Test ctd package

  check:
    command: cargo
    args: ["check", "-p", "centralized-docs"]
    description: Type check ctd package

  clippy:
    command: cargo
    args: ["clippy", "-p", "centralized-docs", "--", "-D", "warnings"]
    description: Lint ctd package

  fmt:
    command: cargo
    args: ["fmt", "--check"]
    description: Check formatting

  :build:
    command: cargo
    args: ["build", "--release", "-p", "centralized-docs"]

  :test:
    command: cargo
    args: ["test", "-p", "centralized-docs"]

  :check:
    command: cargo
    args: ["check", "-p", "centralized-docs"]

  :clippy:
    command: cargo
    args: ["clippy", "-p", "centralized-docs", "--", "-D", "warnings"]

  :fmt:
    command: cargo
    args: ["fmt", "--check"]

  :quick:
    command: echo
    args: ["Running fmt and clippy..."]
    deps:
      - task: fmt
      - task: clippy

  :ci:
    command: echo
    args: ["Running CI: fmt, clippy, check, test"]
    deps:
      - task: fmt
      - task: clippy
      - task: check
      - task: test
