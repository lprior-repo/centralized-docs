[package]
name = "contextual-chunker"
version = "0.1.0"
edition = "2021"
authors = ["Anthropic <opensource@anthropic.com>"]
license = "MIT"
description = "Semantic chunking with hierarchical levels for documentation and knowledge bases"
repository = "https://github.com/lprior-repo/centralized-docs"
documentation = "https://docs.rs/contextual-chunker"
keywords = ["chunking", "rag", "semantic", "documentation", "nlp"]
categories = ["text-processing", "algorithms"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tap = "1.0"
text-splitter = { version = "0.29.3", features = ["markdown", "tiktoken-rs"] }
thiserror.workspace = true
tiktoken = "1.0.1"
tiktoken-rs = "0.9.1"
unicode-segmentation = "1.12"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "contextual_chunker"
path = "src/lib.rs"
