[package]
name = "llms-txt-parser"
version = "0.1.0"
edition = "2021"
authors = ["Anthropic <opensource@anthropic.com>"]
license = "MIT"
description = "Parser for llms.txt files - AI documentation entry points"
repository = "https://github.com/lprior-repo/centralized-docs"
documentation = "https://docs.rs/llms-txt-parser"
keywords = ["llms", "documentation", "ai", "parser", "markdown"]
categories = ["parsing", "text-processing"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "llms_txt_parser"
path = "src/lib.rs"
